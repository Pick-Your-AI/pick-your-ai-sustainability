name: Check source freshness

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - data/**
      - research/**
      - docs/research-*.md
      - templates/**
      - scripts/check_source_freshness.py
      - tests/test_source_freshness.py
      - .github/workflows/source-freshness.yml
  pull_request:
    paths:
      - data/**
      - research/**
      - docs/research-*.md
      - templates/**
      - scripts/check_source_freshness.py
      - tests/test_source_freshness.py
      - .github/workflows/source-freshness.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: source-freshness-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  freshness:
    if: github.repository == 'Pick-Your-AI/pick-your-ai-sustainability'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out code without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-validation.txt
      - name: Run offline tests and validate repository
        run: |
          python -m unittest discover -s tests -v
          python scripts/validate_repository.py
      - name: Restore latest main-branch check baseline
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/source-freshness.yml/runs?branch=main&status=success&per_page=100" \
            --jq '[.workflow_runs[] | select(.head_repository.full_name == "Pick-Your-AI/pick-your-ai-sustainability" and .head_branch == "main" and .status == "completed" and .conclusion == "success" and (.event == "push" or .event == "schedule" or .event == "workflow_dispatch"))] | first | .id // empty')
          if [[ -n "$run_id" ]]; then
            [[ "$run_id" =~ ^[0-9]+$ ]]
            artifact_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?name=source-freshness&per_page=100" \
              --jq '[.artifacts[] | select(.expired == false and .name == "source-freshness")] | first | .id // empty')
            if [[ -n "$artifact_id" ]]; then
              [[ "$artifact_id" =~ ^[0-9]+$ ]]
              gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$RUNNER_TEMP/freshness-previous.zip"
            fi
          fi
      - name: Plan checks without fetching sources on pull requests
        if: github.event_name == 'pull_request'
        run: python scripts/check_source_freshness.py --plan --output freshness-report.json
      - name: Check public sources and calculate next timestamps
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: >-
          python scripts/check_source_freshness.py
          --previous-archive "$RUNNER_TEMP/freshness-previous.zip"
          --output freshness-report.json
      - name: Retain source-check report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ github.event_name == 'pull_request' && format('source-freshness-plan-{0}', github.event.number) || 'source-freshness' }}
          path: freshness-report.json
          if-no-files-found: warn
          retention-days: 7
